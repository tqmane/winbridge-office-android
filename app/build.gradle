plugins { id 'com.android.application' }

android {
    namespace 'io.github.tqmane.winbridge'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.tqmane.winbridge'
        minSdk 33
        // ponytail: Soda currently needs legacy PE mapping permissions; raise after fixing the native loader's execmod path.
        targetSdk providers.gradleProperty('executionTargetSdk').map { it.toInteger() }.getOrElse(28)
        versionCode 1
        versionName '0.1.0-poc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions.jniLibs.useLegacyPackaging = true
    sourceSets.main.assets.srcDir rootProject.file('.local/sdk-assets')
    sourceSets.main.assets.srcDir rootProject.file('.local/input-assets')
}
dependencies { implementation project(':lorie') }

tasks.named('preBuild') {
    doFirst {
        if (!rootProject.file('.local/input-assets/windows-input.exe').exists()) {
            throw new GradleException('Run python scripts/build_native_input.py before building the app.')
        }
        def proot = rootProject.file('.local/native/x86_64/libproot.so')
        if (!proot.exists() || !new String(proot.bytes, 'ISO-8859-1').contains('5.1.107.96-winbridge.2')) {
            throw new GradleException('Missing PRoot IPC/lifecycle fixes. Run python scripts/fetch_native.py for the current verified SDK.')
        }
    }
}
