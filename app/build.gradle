plugins { id 'com.android.application' }

android {
    namespace 'io.github.tqmane.winbridge'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.tqmane.winbridge'
        minSdk 33
        // ponytail: Soda currently needs legacy PE mapping permissions; raise after fixing the native loader's execmod path.
        targetSdk providers.gradleProperty('executionTargetSdk').map { it.toInteger() }.getOrElse(28)
        versionCode 1
        versionName '0.1.0-poc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions.jniLibs.useLegacyPackaging = true
}
dependencies { implementation project(':lorie') }

tasks.named('preBuild') {
    doFirst {
        def proot = rootProject.file('.local/native/x86_64/libproot.so')
        if (!proot.exists() || !new String(proot.bytes, 'ISO-8859-1').contains('5.1.107.96-winbridge')) {
            throw new GradleException('Missing patched PRoot. Run scripts/build_proot_poc.py; the upstream binary fails the i386 IPC check.')
        }
    }
}
